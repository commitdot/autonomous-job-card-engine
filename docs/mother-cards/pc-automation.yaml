# ============================================================================
# AJE Mother Card — Personal Computer Management & Automation
# ============================================================================
apiVersion: agent.autonomous.io/v1alpha1
kind: MotherCard

metadata:
  id: mother-pc-automation
  name: PC Management & Automation Mother Card

spec:
  archetype: custom
  core_philosophy: |
    Idempotent, non-destructive personal computer automation and system maintenance.
    All scripts (PowerShell, Python, Bash) must support dry-run flags (--dry-run),
    log operations to structured logs, avoid touching user credentials or system core,
    and include rollback mechanisms for any modified system or workspace configurations.

  design_system: "CLI / Terminal UI"

  safety_policies:
    privacy_mode: local
    restricted_paths:
      - "**/.ssh/**"
      - "**/.aws/**"
      - "**/.gnupg/**"
      - "**/AppData/Roaming/**"
      - "**/credentials*"
      - "**/*.kdbx"
      - "**/secrets/**"
    banned_commands:
      - "rm -rf /"
      - "Format-Volume"
      - "diskpart"
      - "del /s /q C:\\"
      - "reg delete HKLM"
      - "shutdown"

  governance_policies:
    enable_repo_regex_scan: true
    forbidden_patterns:
      - "(?i)(ghp_|sk-|AKIA|bearer\\s+)[a-zA-Z0-9_\\-]{20,}"
      - "(?i)password\\s*=\\s*[\"'][^\"']+[\"']"
    enable_ast_skeletonization: false
    context_budget_chars: 16000
    enable_alignment_cascades: true
    max_wave_depth: 2
    max_concurrency: 1
    vram_threshold_pct: 80.0
    dual_pass_flakiness_check: false
    enable_containment_jail: true
    enable_audit_chain: true
    composite_integration_commands:
      - "python -m unittest discover -s tests"

  repository:
    local_path: "."
    remote_slug: ""
    target_branch: "main"
    branch_prefix: "aje/pc-"
    auth_token_env: "GITHUB_TOKEN"
    auto_create_pr: false
    auto_merge_pr: false

  rag_knowledge_paths:
    - "docs/pc-configs"
    - "docs/runbooks"

  squad_leads:
    - sysadmin
    - maintenance
    - security
    - desktop-tooling

  global_context:
    os: "Windows 11 / PowerShell 7"
    python_runtime: "3.12+"
    package_managers:
      - "winget"
      - "choco"
      - "pip"

status:
  family_health: "Healthy"
  total_spend_usd: 0.0
  active_children: []
  completed_children: []
  backlog_queue: []
