[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aje-mcp-server"
version = "0.1.0"
description = "MCP server that feeds live signals to the AJE Mother Card for autonomous self-improvement"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
aje-mcp-server = "aje_mcp_server.server:run"

[tool.setuptools.packages.find]
where = ["src"]
