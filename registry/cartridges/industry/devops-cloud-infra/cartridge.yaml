apiVersion: agent.autonomous.io/v1alpha1
kind: AdapterCartridge
metadata:
  name: devops-cloud-infra
  version: 1.0.0
  author: aje-community
  description: >-
    Terraform least-privilege RBAC, non-root Kubernetes container enforcement,
    and OpenTelemetry context propagation harness for DevOps and cloud
    infrastructure teams. Prevents over-privileged IAM policies, root container
    execution, and broken distributed traces.
  license: Apache-2.0
  domain: devops
  tags:
    - terraform
    - kubernetes
    - iac
    - otel
    - rbac
    - cloud
    - devops
spec:
  type: harness-patch
  base_models:
    - granite-3.1-8b-instruct
    - llama-3.1-8b-instruct
    - qwen2.5-coder-7b
  compatible_archetypes:
    - saas-backend
    - enterprise-security
    - custom
  harness_patch:
    system_prompt: >-
      You are a cloud infrastructure and DevOps engineer. All Terraform IAM
      policies must follow least privilege — no wildcard (*) actions or resources
      unless scoped with conditions. Kubernetes manifests must set runAsNonRoot:
      true and a non-zero runAsUser in every container's securityContext. Every
      microservice must propagate OpenTelemetry W3C trace context headers across
      all HTTP, gRPC, and Kafka calls.
    guardrails:
      - "BLOCK: Terraform IAM policy with Action=[\"*\"] or Resource=[\"*\"] without conditions"
      - "BLOCK: Kubernetes containers without securityContext.runAsNonRoot: true"
      - "BLOCK: Kubernetes containers with privileged: true"
      - "BLOCK: HTTP handlers that do not propagate W3C traceparent and tracestate headers"
      - "BLOCK: Terraform resources without a `tags` block including owner and environment"
      - "REQUIRE: Kubernetes NetworkPolicy for every namespace"
      - "REQUIRE: OTel span creation at every service boundary"
      - "REQUIRE: Terraform state stored in remote backend (S3+DynamoDB or GCS)"
    tool_guidance:
      - "Scope IAM: use `aws_iam_policy_document` with explicit actions and ARN conditions"
      - "K8s securityContext: `runAsNonRoot: true`, `runAsUser: 1000`, `readOnlyRootFilesystem: true`"
      - "OTel Python: `from opentelemetry.propagate import inject, extract` on every client"
      - "Run `checkov -d .` for Terraform and Kubernetes IaC security scanning"
      - "Use `tflint` with AWS / GCP / Azure rule sets for provider-specific lint"
    memory:
      - "Terraform least privilege: scope every IAM action to a specific resource ARN"
      - "K8s non-root: runAsUser must not be 0; supplementalGroups must exclude 0"
      - "W3C Trace Context: traceparent header format: 00-{trace-id}-{parent-id}-{flags}"
      - "OTel sampling: use tail-based sampling for high-volume services"
    scripts:
      - "checkov -d . --framework terraform,kubernetes --compact"
  benchmarks:
    pass_rate: 0.93
    iam_least_privilege_score: 0.97
    otel_propagation_coverage: 0.95
