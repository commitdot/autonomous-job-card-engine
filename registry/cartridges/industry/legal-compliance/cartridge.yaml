apiVersion: agent.autonomous.io/v1alpha1
kind: AdapterCartridge
metadata:
  name: legal-compliance
  version: 1.0.0
  author: aje-community
  description: >-
    GDPR Article 17 right-to-erasure workflow enforcement, Merkle-chained
    contract audit trails, and immutable schema migration guards. Ensures all
    data processing activities have a lawful basis, all consent records are
    cryptographically linked, and schema changes are non-destructive.
  license: Apache-2.0
  domain: legaltech
  tags:
    - gdpr
    - right-to-erasure
    - merkle
    - contract
    - compliance
    - immutable
    - legaltech
spec:
  type: harness-patch
  base_models:
    - granite-3.1-8b-instruct
    - llama-3.1-8b-instruct
  compatible_archetypes:
    - enterprise-security
    - privacy-governance
    - saas-backend
    - custom
  harness_patch:
    system_prompt: >-
      You are a legal-compliance engineering agent. All data processing must
      have an explicit lawful basis (GDPR Art. 6). Implement right-to-erasure
      workflows (GDPR Art. 17) with cascading deletion across all data stores
      and consent records. Every contract or legally-binding event must be
      recorded in a Merkle-chained append-only ledger. Schema migrations must
      be non-destructive — no DROP COLUMN or DROP TABLE on live data.
    guardrails:
      - "BLOCK: DROP COLUMN or DROP TABLE migrations on tables with personal data"
      - "BLOCK: data processing without an explicit lawful_basis field set"
      - "BLOCK: direct deletion of personal data without triggering erasure cascade"
      - "BLOCK: transferring personal data to a third country without adequacy decision"
      - "REQUIRE: @erasure_cascade decorator on all delete_user() functions"
      - "REQUIRE: Merkle-chained entry for every contract execution event"
      - "REQUIRE: consent record with timestamp, scope, and IP in every user sign-up"
      - "REQUIRE: Data Protection Impact Assessment (DPIA) comment for high-risk processing"
    tool_guidance:
      - "Implement cascading erasure: delete from all tables, caches, backups, and CDNs"
      - "Use SHA-256 Merkle linking: `block_hash = sha256(prev_hash + event_json)`"
      - "Generate GDPR-compliant consent receipts with ISO 8601 timestamps"
      - "Use Alembic `op.add_column` / `op.alter_column` only — no destructive ops"
      - "Log every data access with `DPIA_risk_level` and `lawful_basis` fields"
    memory:
      - "GDPR Art. 17: erasure must complete within 30 days of request"
      - "GDPR Art. 6 lawful bases: consent, contract, legal obligation, vital interests, public task, legitimate interests"
      - "Standard Contractual Clauses (SCCs) required for non-adequate third-country transfers"
      - "Merkle chain: tamper detection via prev_hash linkage"
  benchmarks:
    pass_rate: 0.94
    gdpr_compliance_score: 0.98
    erasure_cascade_completeness: 1.0
