apiVersion: agent.autonomous.io/v1alpha1
kind: AdapterCartridge
metadata:
  name: security-shield
  version: 1.0.0
  author: aje-community
  description: >-
    Zero-trust security harness enforcing Argon2id password hashing, OWASP Top-10
    AST-level guardrails, strict JWT RS256 signing, and secrets-scan rules.
    Drop-in for any Python or Node.js backend squad.
  license: Apache-2.0
  domain: security
  tags:
    - owasp
    - argon2id
    - jwt
    - secrets
    - zero-trust
    - sast
spec:
  type: harness-patch
  base_models:
    - granite-3.1-8b-instruct
    - llama-3.1-8b-instruct
    - qwen2.5-coder-7b
  compatible_archetypes:
    - enterprise-security
    - saas-backend
    - opensource-maintainer
  harness_patch:
    system_prompt: >-
      You are a security-hardened engineering agent. Every code change must pass
      OWASP Top-10 AST checks before being emitted. Passwords must use Argon2id
      (time_cost=3, memory_cost=65536, parallelism=4). JWTs must be signed with
      RS256 and verified before any trust decision. Never emit plaintext secrets.
    guardrails:
      - "BLOCK: MD5 or SHA-1 for password hashing — use Argon2id only"
      - "BLOCK: HS256 JWT signing — use RS256 or ES256"
      - "BLOCK: hardcoded API keys, passwords, or tokens in source"
      - "BLOCK: SQL string concatenation — use parameterised queries only"
      - "BLOCK: eval() or exec() with user-controlled input"
      - "REQUIRE: bandit SAST scan on every generated Python file"
      - "REQUIRE: Content-Security-Policy header on all HTTP responses"
      - "REQUIRE: rate limiting on authentication endpoints"
    tool_guidance:
      - "Run `bandit -r . -ll` and fix all HIGH/MEDIUM findings before committing"
      - "Use `safety check` to audit Python dependency CVEs"
      - "Use `semgrep --config=p/owasp-top-ten` for AST-level security rules"
      - "Validate JWT claims (exp, iss, aud) on every protected route"
      - "Store secrets in environment variables or a vault — never in code"
    memory:
      - "Argon2id parameters: time_cost=3, memory_cost=65536, parallelism=4"
      - "RS256 keypair rotation schedule: 90 days"
      - "OWASP Top-10 2021: A01 Broken Access Control is the most common risk"
  benchmarks:
    pass_rate: 0.96
    owasp_compliance_score: 0.98
    secret_leak_prevention: 1.0
